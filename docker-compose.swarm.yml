# Docker Swarm 栈：GPU Worker 服务
# 部署: docker stack deploy -c docker-compose.swarm.yml retinaclip
# 仅在有 node.labels.type == gpu 的节点上运行，初始 replicas 由 autoscaler 控制

version: "3.8"

services:
  gpu-worker:
    image: ${GPU_WORKER_IMAGE:-your-gpu-image:latest}
    deploy:
      replicas: 0
      placement:
        constraints:
          - node.labels.type == gpu
      resources:
        reservations:
          generic_resources:
            - discrete_resource_spec:
                kind: "nvidia"
                value: 1
      restart_policy:
        condition: on-failure
        delay: 5s
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_QUEUE=${RABBITMQ_QUEUE:-media.uploaded}
    # 若你的镜像需要 GPU 可见性，Swarm 会通过 generic_resources 调度到 GPU 节点
